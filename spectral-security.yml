extends:
    - "@stoplight/spectral-owasp-ruleset"

rules:
  "owasp:api9:2023-inventory-access": "off",
  "owasp:api2:2023-write-restricted": "off",
  "owasp:api4:2023-rate-limit": "off",
  "owasp:api4:2023-string-limit":
    message: "Schema of type string must specify maxLength!"
    description: "String size should be limited to mitigate resource exhaustion attacks. This can be done using `maxLength`."
    severity: error
    given: '$..[?(@ && @.type=="string")]'
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          anyOf:
            - required: ["maxLength"]
            - required: ["enum"]
            - required: ["const"]
            - required: ["format"]
              properties:
                format:
                  type: string
                  enum: ["uuid","date","date-time"]
